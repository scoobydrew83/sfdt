# Generated by `sfdt ci init --provider azure --type deploy`.
# A standalone Azure Pipelines definition for smart delta validation on PRs:
# a code quality scan (advisory) followed by a check-only deploy. Generate the
# matching real-deploy pipeline with --type release.
#
# The quality scan expects a committed .sfdt/config.json (run `sfdt init`).
#
# Required pipeline variables (Pipelines > Library / pipeline variables, secret):
{{authSecretsDoc}}
trigger: none
pr:
  branches:
    include:
      - '*'
pool:
  vmImage: ubuntu-latest
steps:
  - checkout: self
    fetchDepth: 0
  - task: NodeTool@0
    inputs:
      versionSpec: '{{nodeVersion}}'
  - script: npm install --global @salesforce/cli
    displayName: Install Salesforce CLI
  {{authSteps}}
  {{qualitySteps}}
  - script: npx --yes @sfdt/cli@latest deploy --smart --org {{org}} --delta-base "origin/$BASE_REF" --dry-run
    displayName: Smart delta validation
    # The target branch goes through `env:` rather than straight into the script
    # body. A `$(VAR)` macro is substituted into the script text the agent writes
    # to disk *before* bash parses it, and a git ref may contain $, backticks,
    # (, ), ; and | — so a PR targeting a branch named `x$(...)` would execute on
    # the agent, after the auth step above has already written a live org
    # credential to ~/.sfdx. `pr: branches: include: ['*']` means any branch a
    # contributor can create is a valid target. As an env var it is only data.
    # Mirrors scripts/ci/github-deploy.yml, which carries the same reasoning.
    env:
      BASE_REF: $(System.PullRequest.TargetBranch)
