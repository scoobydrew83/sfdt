name: License Check

on:
  # No paths filter on pull_request: license-check is a required status check
  # on main, and a path-filtered required check never reports on PRs that
  # don't touch these files, which leaves the PR blocked forever.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'

jobs:
  license-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check dependency licenses
        run: |
          npx license-checker --production --onlyAllow \
            "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;BlueOak-1.0.0;0BSD;CC0-1.0;CC-BY-3.0;CC-BY-4.0;Unlicense;Python-2.0" \
            --excludePrivatePackages \
            --summary
