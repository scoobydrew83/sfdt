name: Docker Publish

# Builds the official multi-arch image and pushes it to GHCR.
#
# - On every published GitHub Release tagged `v*` (a CLI release), builds that tag.
# - On manual dispatch, builds the current branch (use this to (re)publish a
#   specific version, e.g. after a Dockerfile fix that didn't ride a version bump).
#
# Split out of ci.yml so it can be re-run on demand — a build failure no longer
# requires a fresh version bump to retry.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (e.g. 0.14.0). Defaults to package.json version.'
        required: false
        default: ''
  # Called by ci.yml's publish job so the image builds automatically on a CLI
  # release — a GitHub Release created by GITHUB_TOKEN does NOT fire the
  # `release: published` trigger above, so the CI publish flow invokes this
  # directly instead of relying on the release event.
  workflow_call:
    inputs:
      version:
        description: 'Image version tag. Defaults to package.json version.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  docker-publish:
    # Run for dispatch and workflow_call (event_name is the caller's event, e.g.
    # 'push'); for a `release` event only build CLI tags (`v*`), skipping
    # ext-v* / vscode-v* releases.
    if: github.repository == 'scoobydrew83/sfdt' && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/scoobydrew83/sfdt
    steps:
      - uses: actions/checkout@v7
        with:
          # release: build the released tag; dispatch: build the branch it ran on.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Resolve + validate version
        id: ver
        env:
          # `inputs` is populated for both workflow_dispatch and workflow_call.
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            VERSION="${RELEASE_TAG#v}"
          elif [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          # Guard against anything unexpected reaching the image tag.
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$'; then
            echo "Refusing to publish: invalid version '${VERSION}'"; exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing image version ${VERSION}"

      # The image installs from the public registry, and `publish` runs seconds
      # earlier in the same workflow — npm's own output says the package "may
      # take a few minutes to become available". v0.24.0 failed here: the build
      # 404'd on @sfdt/flow-core's tarball ~100s after it was published, because
      # a *transitive* dep had not propagated yet.
      #
      # `npm install --dry-run` resolves the whole tree and fetches nothing, so
      # it fails on exactly the same 404 the image build would — a precise
      # precondition rather than a proxy for one. `npm view` is not enough:
      # metadata appears before the tarball is fetchable, which is what bit us.
      - name: Wait for the npm tarball (and its deps) to be fetchable
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # ~5 min at 10s intervals. Longer than any propagation delay we have
          # seen, short enough that a genuinely bad version fails the run rather
          # than hanging until the job timeout.
          # Resolve in a scratch dir, not with -g: the global form additionally
          # depends on the runner's npm prefix existing, which turns an
          # unrelated environment problem into an indistinguishable failure.
          PROBE="$(mktemp -d)"
          trap 'rm -rf "$PROBE"' EXIT
          cd "$PROBE"
          for attempt in $(seq 1 30); do
            if npm install --dry-run --no-audit --no-fund "@sfdt/cli@${VERSION}" >/dev/null 2>&1; then
              echo "@sfdt/cli@${VERSION} and its dependencies resolve (attempt ${attempt})."
              exit 0
            fi
            echo "attempt ${attempt}/30: @sfdt/cli@${VERSION} not fully resolvable yet, waiting 10s…"
            sleep 10
          done
          echo "::error::@sfdt/cli@${VERSION} still does not resolve after 5 minutes."
          # Surface the actual resolution error rather than only the timeout.
          npm install --dry-run --no-audit --no-fund "@sfdt/cli@${VERSION}" || true
          exit 1

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
