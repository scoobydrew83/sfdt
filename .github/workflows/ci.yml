name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'    # 2am UTC nightly
  workflow_dispatch: {}    # manual on-demand integration smoke

jobs:
  test:
    # develop is pushed to more than one remote, so a push-triggered run would
    # grade the same commit twice. This repo owns push (develop/main); elsewhere
    # the suite runs on pull_request only.
    if: github.event_name != 'push' || github.repository == 'scoobydrew83/sfdt'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Security audit
        # Runtime deps only (--omit=dev): high-severity advisories in build tooling
        # (e.g. wxt -> web-ext-run -> firefox-profile -> adm-zip, and wxt's esbuild)
        # never ship in any published artifact and can't be forward-fixed while wxt is
        # at its latest version. The weekly scheduled-audit.yml still reports dev
        # advisories at moderate so they stay visible for when an upstream fix lands.
        run: npm audit --audit-level=high --omit=dev
      - run: npm run lint
      - run: npm test
      - run: npm run test:web
      # test:web only runs vitest. Neither the Next build nor web's tsc ran in CI
      # until now, so a Next major could land green on unit tests alone.
      - name: Typecheck @sfdt/web
        run: npm run typecheck -w @sfdt/web
      - name: Build @sfdt/web (Next build — flow-core is already built by pretest)
        run: npm run build:web
      - name: Surface contracts (catalog drift + license/node/auth consistency)
        run: npm run check:all-contracts
      - name: Build @sfdt/plugin (codegen + tsc — catches CLI command-tree drift)
        run: npm run build:plugin
      - name: Publish dry-run
        run: npm publish --dry-run
      - name: Publish dry-run @sfdt/plugin
        run: npm publish --dry-run --workspace=@sfdt/plugin

  gui-build:
    # Same push/pull_request split as `test` above.
    if: github.event_name != 'push' || github.repository == 'scoobydrew83/sfdt'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # The GUI imports @sfdt/flow-core, whose package `exports` resolve to its
      # compiled dist/. Build flow-core first or `vite build` can't resolve it.
      - name: Build @sfdt/flow-core (GUI build dependency)
        run: npm run build:flow-core
      - name: Test GUI
        run: npm test --workspace=gui
      - name: Build GUI
        run: npm run build --workspace=gui

  # Gate: skip the live integration smoke gracefully when the DevHub auth
  # secret isn't configured, so the job is a no-op (not a failure) until a
  # maintainer adds SFDX_AUTH_URL + SF_DEVHUB_USERNAME.
  #
  # Runs on the nightly schedule and manual dispatch ONLY — never per push.
  # Creating a scratch org on every develop push exhausts the Dev Hub's daily
  # scratch-org allocation; a once-nightly smoke (plus on-demand) is enough.
  # (schedule/workflow_dispatch never carry a pull_request context, so fork PRs
  # still never see the secrets.)
  integration-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          if [ -n "$SFDX_AUTH_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Live integration smoke skipped — set the SFDX_AUTH_URL and SF_DEVHUB_USERNAME secrets (and the 'integration' environment) to enable it."
          fi

  # Tier 2 live smoke against a real Dev Hub: create a scratch org, run the
  # deploy/test/audit/versions/drift/rollback cycle against it, always delete.
  # Behind the protected 'integration' environment and gated on secrets being
  # present, on develop only.
  integration:
    needs: [test, gui-build, integration-gate]
    if: needs.integration-gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: integration
    permissions:
      contents: read
    env:
      SF_USERNAME: ${{ secrets.SF_DEVHUB_USERNAME }}
      SF_CONTAINER_MODE: 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build @sfdt/flow-core (CLI runtime dep)
        run: npm run build:flow-core
      - name: Pack @sfdt/flow-core and @sfdt/cli
        # @sfdt/cli declares @sfdt/flow-core@^0.9.0 as a runtime dep. On a commit
        # where flow-core is not yet on the public npm registry, the CLI tarball
        # install would 404. Packing flow-core alongside and installing both at
        # once keeps the integration job self-contained.
        run: |
          npm pack --workspace=@sfdt/flow-core
          npm pack
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli
      - name: Install sfdt globally from packed tarballs
        # Install flow-core first so npm's local cache satisfies @sfdt/cli's
        # runtime dep without hitting the registry. Explicit filenames so the
        # glob doesn't double-list flow-core.
        run: npm install -g sfdt-flow-core-*.tgz sfdt-cli-*.tgz
      - name: Checkout synthetic-spark fixture
        uses: actions/checkout@v7
        with:
          repository: scoobydrew83/synthetic-spark
          path: synthetic-spark
      - name: Authenticate Dev Hub
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          printf '%s' "$SFDX_AUTH_URL" > auth_url.txt
          sf org login sfdx-url --sfdx-url-file auth_url.txt --set-default-dev-hub
          rm -f auth_url.txt
      - name: Run integration smoke (scratch org create → cycle → always-delete)
        run: ./scripts/integration/run-integration-tests.sh ./synthetic-spark

  publish-beta:
    needs: [test, gui-build]
    runs-on: ubuntu-latest
    if: github.repository == 'scoobydrew83/sfdt' && (github.ref == 'refs/heads/develop' && github.event_name == 'push')
    environment: beta
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check for pre-release version bump
        id: version
        run: |
          CURR_VERSION=$(node -p "require('./package.json').version")
          PREV_VERSION=$(git show HEAD~1:package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo "0.0.0")
          echo "Current: v${CURR_VERSION}, Previous: v${PREV_VERSION}"
          if [ "${CURR_VERSION}" != "${PREV_VERSION}" ] && [[ "${CURR_VERSION}" == *"-"* ]]; then
            echo "Pre-release bump: v${PREV_VERSION} -> v${CURR_VERSION}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No pre-release bump detected"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${CURR_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Create pre-release git tag
        if: steps.version.outputs.changed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -d "v${RELEASE_VERSION}" 2>/dev/null || true
          git push origin ":refs/tags/v${RELEASE_VERSION}" 2>/dev/null || true
          git tag -a "v${RELEASE_VERSION}" -m "Pre-release v${RELEASE_VERSION}"
          git push origin "v${RELEASE_VERSION}"
      - run: npm ci
        if: steps.version.outputs.changed == 'true'
      - name: Build GUI
        if: steps.version.outputs.changed == 'true'
        run: npm run build:gui
      - name: Pin npm for OIDC trusted publishing
        # This repo publishes via npm OIDC trusted publishing (no token) + provenance.
        # That needs npm >= 11.5.1; the runner's bundled npm 10.x can't (ENEEDAUTH).
        # `npm@latest` is currently the broken 12.0.0 (missing `sigstore`, so
        # --provenance crashes), so pin the newest stable 11.x. Bump deliberately —
        # never a floating `@latest`.
        if: steps.version.outputs.changed == 'true'
        run: npm install -g npm@11.18.0
      - name: Publish @sfdt/flow-core beta to npm
        if: steps.version.outputs.changed == 'true'
        run: npm publish --workspace=@sfdt/flow-core --provenance --access public --tag beta
      - name: Publish @sfdt/cli beta to npm
        if: steps.version.outputs.changed == 'true'
        run: npm publish --provenance --access public --tag beta
      - name: Publish @sfdt/plugin beta to npm
        # Thin sf-CLI wrapper; published AFTER the CLI so its @sfdt/cli dep
        # resolves. prepack builds dist/ + oclif.manifest.json.
        if: steps.version.outputs.changed == 'true'
        run: npm publish --workspace=@sfdt/plugin --provenance --access public --tag beta
      - name: Create GitHub Pre-Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v${VERSION}" --generate-notes --prerelease


  publish:
    needs: [test, gui-build]
    runs-on: ubuntu-latest
    if: github.repository == 'scoobydrew83/sfdt' && (github.ref == 'refs/heads/main' && github.event_name == 'push')
    environment: production
    # GitHub can deliver one merge as two `push` events (v0.27.1: two CI runs on
    # the same SHA, a minute apart). Queue publish runs instead of racing them;
    # never cancel one mid-publish. The queued run then sees the published
    # release in "Check for version bump" and skips.
    concurrency:
      group: release-publish-main
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      # issues: write is for the skills-pack escalation step only — a job-level
      # permissions block is restrictive, so without it GITHUB_TOKEN 403s.
      issues: write
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      docker_needed: ${{ steps.distro.outputs.docker_needed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check for version bump
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURR_VERSION=$(node -p "require('./package.json').version")
          PREV_VERSION=$(git show HEAD~1:package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo "0.0.0")
          FC_VERSION=$(node -p "require('./packages/flow-core/package.json').version")
          PLUGIN_VERSION=$(node -p "require('./packages/plugin/package.json').version")
          # Refuse to publish a prerelease version as latest from main
          if [[ "${CURR_VERSION}" == *"-"* ]]; then
            echo "ERROR: prerelease version ${CURR_VERSION} must not be published from main (use develop instead)"
            exit 1
          fi
          # Exact-version lookups, never `latest`: right after a publish npm can
          # report the new version as staged (E409 "previously staged version")
          # while `latest` still shows the old one for minutes.
          on_npm() { npm view "$1@$2" version >/dev/null 2>&1 && echo yes || echo no; }
          echo "package.json: v${CURR_VERSION} · previous commit: v${PREV_VERSION}"
          echo "npm: @sfdt/cli@${CURR_VERSION}=$(on_npm @sfdt/cli "${CURR_VERSION}") · @sfdt/plugin@${PLUGIN_VERSION}=$(on_npm @sfdt/plugin "${PLUGIN_VERSION}") · @sfdt/flow-core@${FC_VERSION}=$(on_npm @sfdt/flow-core "${FC_VERSION}")"
          # The GitHub Release is the last thing this job creates, after all
          # three npm publishes succeed, so a published (non-draft) release
          # v<version> means the release is done. That holds even while npm is
          # still serving the version as staged. Anything short of it (no
          # release, or a draft) runs the job again, and every step below is
          # idempotent, so a failed publish self-heals on the next push to main.
          # A failed API call fails the step rather than guessing: a guess
          # either double-publishes or skips a release.
          REL_STATE=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"v${CURR_VERSION}\")][0] | if . == null then \"none\" elif .draft then \"draft\" else \"published\" end")
          echo "GitHub Release v${CURR_VERSION}: ${REL_STATE}"
          if [ "${REL_STATE}" = "published" ]; then
            echo "Already released v${CURR_VERSION} — nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publish needed: v${CURR_VERSION} has no published GitHub Release yet (${REL_STATE})."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${CURR_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Check distribution channels
        # A published release only proves the tag, npm and the release itself
        # are done. The channels after it (tap, skills pack, and the docker job,
        # which a GITHUB_TOKEN-created release never triggers by event) can
        # still be missing if a run was cancelled or lost its runner after the
        # release step. The queued duplicate run would then skip them. So each
        # channel is checked for this version on its own and re-runs when it is
        # missing, even when changed=false. All three are idempotent. A failed
        # lookup counts as "needed", because re-running is safe and skipping
        # isn't.
        id: distro
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # GHCR image: anonymous pull token, then HEAD the manifest (index or single).
          TOKEN=$(curl -fsS "https://ghcr.io/token?scope=repository:scoobydrew83/sfdt:pull" | jq -r '.token // empty' || true)
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -I \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/scoobydrew83/sfdt/manifests/${VERSION}" || true)
          case "${CODE}" in
            200) DOCKER=false ;;
            404) DOCKER=true ;;
            *) echo "::warning::GHCR manifest lookup for ${VERSION} returned '${CODE}'; treating the image as missing."; DOCKER=true ;;
          esac
          # Homebrew tap: the formula must point at this version's tarball with a real sha256.
          EMPTY_SHA=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          FORMULA=$(gh api repos/scoobydrew83/homebrew-sfdt/contents/Formula/sfdt.rb --jq .content 2>/dev/null | base64 -d 2>/dev/null || true)
          if printf '%s' "${FORMULA}" | grep -qF "cli-${VERSION}.tgz\"" && ! printf '%s' "${FORMULA}" | grep -qF "${EMPTY_SHA}"; then TAP=false; else TAP=true; fi
          # Skills pack: the README footer names the version it was synced from.
          README=$(gh api repos/scoobydrew83/sfdt-skills/contents/README.md --jq .content 2>/dev/null | base64 -d 2>/dev/null || true)
          if printf '%s' "${README}" | grep -qF "@sfdt/cli\` v${VERSION}"; then SKILLS=false; else SKILLS=true; fi
          echo "v${VERSION} still needed: docker image=${DOCKER} · Homebrew tap=${TAP} · skills pack=${SKILLS}"
          {
            echo "docker_needed=${DOCKER}"
            echo "tap_needed=${TAP}"
            echo "skills_needed=${SKILLS}"
          } >> "$GITHUB_OUTPUT"
      - name: Create git tag
        # Idempotent. Creates v<version> only if it's missing. A tag already on
        # this commit is left alone. A tag on another commit is moved only if no
        # GitHub Release (draft or published) uses it: deleting a release's tag
        # turns that release into an untagged draft, which is what happened to
        # v0.27.1 when a duplicate run re-created the tag.
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${RELEASE_VERSION}"
          TARGET=$(git rev-parse HEAD)
          # Peeled commit for an annotated tag, else the lightweight tag's own sha.
          CURRENT=$(git ls-remote origin "refs/tags/${TAG}^{}" | awk '{print $1}')
          [ -n "${CURRENT}" ] || CURRENT=$(git ls-remote origin "refs/tags/${TAG}" | awk '{print $1}')
          if [ "${CURRENT}" = "${TARGET}" ]; then
            echo "${TAG} already points at ${TARGET} — leaving it."
            exit 0
          fi
          if [ -n "${CURRENT}" ]; then
            USED=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq "[.[] | select(.tag_name == \"${TAG}\")] | length")
            if [ "${USED}" != "0" ]; then
              echo "::error::${TAG} points at ${CURRENT}, not ${TARGET}, and a GitHub Release uses it. Refusing to move it. Resolve by hand (RELEASING.md §1)."
              exit 1
            fi
            echo "::warning::${TAG} points at ${CURRENT} with no release attached (created before merge?); moving it to ${TARGET}."
            git push origin ":refs/tags/${TAG}"
          fi
          git tag -d "${TAG}" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}" "${TARGET}"
          git push origin "${TAG}"
      - name: Update floating major tag
        # Consumers of the root composite action reference `scoobydrew83/sfdt@v0`
        # (later `@v1`, …) — keep that tag pointing at the newest stable release.
        # Stable releases only; beta publishes never move it. Moves (force-push)
        # only when it doesn't already point at this release's commit.
        if: steps.version.outputs.changed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          MAJOR="v${RELEASE_VERSION%%.*}"
          TARGET=$(git rev-parse HEAD)
          CURRENT=$(git ls-remote origin "refs/tags/${MAJOR}^{}" | awk '{print $1}')
          [ -n "${CURRENT}" ] || CURRENT=$(git ls-remote origin "refs/tags/${MAJOR}" | awk '{print $1}')
          if [ "${CURRENT}" = "${TARGET}" ]; then
            echo "${MAJOR} already points at ${TARGET} — leaving it."
            exit 0
          fi
          git fetch --force origin "refs/tags/v${RELEASE_VERSION}:refs/tags/v${RELEASE_VERSION}"
          git tag -f "$MAJOR" "v${RELEASE_VERSION}"
          git push -f origin "$MAJOR"
      - run: npm ci
        # Also needed by the skills pack sync (bin/sfdt.js) when only that channel lags.
        if: steps.version.outputs.changed == 'true' || steps.distro.outputs.skills_needed == 'true'
      - name: Build GUI
        if: steps.version.outputs.changed == 'true'
        run: npm run build:gui
      - name: Pin npm for OIDC trusted publishing
        # This repo publishes via npm OIDC trusted publishing (no token) + provenance.
        # That needs npm >= 11.5.1; the runner's bundled npm 10.x can't (ENEEDAUTH).
        # `npm@latest` is currently the broken 12.0.0 (missing `sigstore`, so
        # --provenance crashes), so pin the newest stable 11.x. Bump deliberately —
        # never a floating `@latest`.
        if: steps.version.outputs.changed == 'true'
        run: npm install -g npm@11.18.0
      - name: Publish @sfdt/flow-core to npm
        # Must publish flow-core BEFORE @sfdt/cli — the CLI depends on it as
        # a regular runtime dep. The workspace's prepack hook builds dist/
        # before packing. Idempotent: a "you cannot publish over previously
        # published version" error from npm is acceptable on republish.
        if: steps.version.outputs.changed == 'true'
        run: |
          npm publish --workspace=@sfdt/flow-core --provenance --access public || {
            EXIT=$?
            if npm view @sfdt/flow-core@$(node -p "require('./packages/flow-core/package.json').version") >/dev/null 2>&1; then
              echo "flow-core version already published — continuing"
            else
              exit $EXIT
            fi
          }
      - name: Publish @sfdt/cli to npm
        if: steps.version.outputs.changed == 'true'
        # Idempotent (like flow-core/plugin): if publish fails but the version is
        # already on npm, keep going — supports the self-healing re-run above.
        run: |
          npm publish --provenance --access public || {
            EXIT=$?
            if npm view @sfdt/cli@$(node -p "require('./package.json').version") >/dev/null 2>&1; then
              echo "cli version already published — continuing"
            else
              exit $EXIT
            fi
          }
      - name: Publish @sfdt/plugin to npm
        # Thin sf-CLI wrapper. Publish AFTER @sfdt/cli so its `@sfdt/cli`
        # dependency resolves on the registry. prepack builds dist/ +
        # oclif.manifest.json. Idempotent: republishing the same version is OK.
        if: steps.version.outputs.changed == 'true'
        run: |
          npm publish --workspace=@sfdt/plugin --provenance --access public || {
            EXIT=$?
            if npm view @sfdt/plugin@$(node -p "require('./packages/plugin/package.json').version") >/dev/null 2>&1; then
              echo "plugin version already published — continuing"
            else
              exit $EXIT
            fi
          }
      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        # Idempotent. Creates the release only if none exists, pinned to the
        # existing tag (--verify-tag: never let gh invent a tag or leave an
        # untagged draft). If an earlier run's release became an untagged draft
        # because its tag was deleted and re-created, re-attach and publish it.
        # Then verify it is published, so a draft can't pass silently.
        run: |
          TAG="v${VERSION}"
          EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"${TAG}\")][0] | if . == null then \"\" else \"\\(.id) \\(.draft)\" end")
          if [ -z "${EXISTING}" ]; then
            gh release create "${TAG}" --generate-notes --verify-tag --latest
          elif [ "${EXISTING#* }" = "true" ]; then
            echo "::warning::Release ${TAG} exists as a draft; publishing it on the existing tag."
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${EXISTING%% *}" \
              -f tag_name="${TAG}" -F draft=false -f make_latest=true >/dev/null
          else
            echo "Release ${TAG} already published."
          fi
          DRAFT=$(gh release view "${TAG}" --json isDraft --jq .isDraft)
          if [ "${DRAFT}" != "false" ]; then
            echo "::error::Release ${TAG} is not published (isDraft=${DRAFT})."
            exit 1
          fi
      - name: Bump Homebrew tap
        # Pushes the new tarball url + sha256 to the separate tap repo
        # (scoobydrew83/homebrew-sfdt). The default GITHUB_TOKEN can't write to
        # another repo, so this needs a fine-grained PAT (contents:write on the
        # tap) stored as HOMEBREW_TAP_TOKEN. Skips cleanly if the secret is unset.
        # continue-on-error: a cosmetic tap bump must never fail the release job
        # (npm/GHCR already published by this point) or block the downstream
        # `docker` job — a bad/expired PAT surfaces as a yellow step, not a red run.
        if: steps.version.outputs.changed == 'true' || steps.distro.outputs.tap_needed == 'true'
        continue-on-error: true
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping tap bump (bump Formula/sfdt.rb manually)."
            exit 0
          fi
          set -euo pipefail
          TARBALL="https://registry.npmjs.org/@sfdt/cli/-/cli-${VERSION}.tgz"
          # npm can take minutes to serve a just-published tarball. v0.27.1's
          # curl 404'd, the pipe hashed empty input, and the tap shipped the
          # sha256 of nothing (e3b0c442…). So download to a file with backoff
          # (up to ~15 min), refuse an empty file or the empty-input hash, and
          # check the bytes against npm's own dist.integrity.
          EMPTY_SHA=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          TGZ="${RUNNER_TEMP}/cli-${VERSION}.tgz"
          DEADLINE=$((SECONDS + 900)); DELAY=10
          until curl -fsSL -o "${TGZ}" "${TARBALL}" && [ -s "${TGZ}" ]; do
            if [ "${SECONDS}" -ge "${DEADLINE}" ]; then
              echo "::error::${TARBALL} was not downloadable after 15 minutes — tap not bumped."
              exit 1
            fi
            echo "Tarball not served yet; retrying in ${DELAY}s…"
            sleep "${DELAY}"; DELAY=$(( DELAY * 2 > 60 ? 60 : DELAY * 2 ))
          done
          SHA=$(shasum -a 256 "${TGZ}" | awk '{print $1}')
          if [ -z "${SHA}" ] || [ "${SHA}" = "${EMPTY_SHA}" ]; then
            echo "::error::Refusing to write sha256 '${SHA}' (empty download)."
            exit 1
          fi
          INTEGRITY=$(npm view "@sfdt/cli@${VERSION}" dist.integrity 2>/dev/null || true)
          if [ -n "${INTEGRITY}" ]; then
            ACTUAL="sha512-$(openssl dgst -sha512 -binary "${TGZ}" | base64 -w0)"
            if [ "${ACTUAL}" != "${INTEGRITY}" ]; then
              echo "::error::Downloaded tarball does not match npm dist.integrity (${INTEGRITY})."
              exit 1
            fi
          else
            echo "::warning::npm did not report dist.integrity for ${VERSION}; using the sha256 of the downloaded tarball unverified."
          fi
          echo "Tarball sha256: ${SHA}"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/scoobydrew83/homebrew-sfdt.git" tap
          cd tap
          sed -i -E "s#(url \")[^\"]*(\")#\1${TARBALL}\2#" Formula/sfdt.rb
          sed -i -E "s#(sha256 \")[^\"]*(\")#\1${SHA}\2#" Formula/sfdt.rb
          if git diff --quiet; then
            echo "Formula already at ${VERSION} — nothing to push."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump formula to ${VERSION}"
          git push
      - name: Sync skills pack repo
        id: skills_sync
        # Regenerates the standalone pack repo (scoobydrew83/sfdt-skills) that
        # backs `npx skills add scoobydrew83/sfdt-skills`. Same cross-repo
        # constraint as the tap bump above: the default GITHUB_TOKEN can't write
        # to another repo, so this needs a fine-grained PAT (contents:write on
        # sfdt-skills) stored as SKILLS_PACK_TOKEN. Skips cleanly if unset.
        # continue-on-error for the same reason as the tap: a downstream
        # distribution sync must never fail an already-published release.
        # The export only wipes skills/ in the target, so that repo's README and
        # LICENSE (hand-written, not generated) survive each sync — except the
        # README's "Synced from" footer, which the export bumps from package.json.
        if: steps.version.outputs.changed == 'true' || steps.distro.outputs.skills_needed == 'true'
        continue-on-error: true
        env:
          SKILLS_PACK_TOKEN: ${{ secrets.SKILLS_PACK_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Default: not synced. The follow-up step turns a quiet miss into an
          # issue — a skipped sync must be loud, or the mirror drifts (H-014,
          # observed at 0.18.2→0.19.0: token-unset exit 0 looked like success).
          echo "synced=false" >> "$GITHUB_OUTPUT"
          if [ -z "${SKILLS_PACK_TOKEN}" ]; then
            echo "SKILLS_PACK_TOKEN not set — skipping skills pack sync."
            echo "Sync manually with: sfdt skills export --target pack --out ../sfdt-skills"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${SKILLS_PACK_TOKEN}@github.com/scoobydrew83/sfdt-skills.git" skills-pack
          node bin/sfdt.js skills export --target pack --out skills-pack
          cd skills-pack
          # The export bumps the README "Synced from" footer from package.json —
          # no out-of-band sed needed, so a manual sync stays in step too.
          # manifest.json carries a generatedAt timestamp that changes on every
          # export, so diff the real content instead — otherwise a self-healing
          # re-run of an already-published version pushes a timestamp-only commit.
          if git diff --quiet -- skills README.md; then
            echo "Skills pack already current at v${VERSION} — nothing to push."
            echo "synced=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Sync skills from @sfdt/cli v${VERSION}"
          git push
          echo "synced=true" >> "$GITHUB_OUTPUT"
      - name: Escalate a missed skills pack sync
        # The sync step is continue-on-error and skips quietly without the PAT —
        # correct for a release job (distribution must never fail a published
        # release), but the miss itself must surface. One idempotent issue per
        # missed version; @claude answers issues in this repo, so the issue IS
        # the escalation edge.
        #
        # continue-on-error for the same reason as the sync it reports on: this
        # step only ever runs on an already-degraded release, and a failure to
        # file the issue (403, API blip) must not turn that into a red run and
        # block the downstream `docker` job.
        if: (steps.version.outputs.changed == 'true' || steps.distro.outputs.skills_needed == 'true') && steps.skills_sync.outputs.synced != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TITLE="skills pack sync missed for v${VERSION}"
          if gh issue list --state open --search "\"${TITLE}\" in:title" --json number --jq length | grep -qv '^0$'; then
            echo "Escalation issue already open."
            exit 0
          fi
          gh issue create --title "${TITLE}" \
            --body "The release job for v${VERSION} did not sync scoobydrew83/sfdt-skills (SKILLS_PACK_TOKEN unset/expired, or the sync step failed — see this run's logs). The mirror drifts until this lands. Fix the token, then sync manually: \`sfdt skills export --target pack --out ../sfdt-skills\` and push. Harness check: H-014."
        # The Docker image builds via the `docker` job below, which calls the
        # reusable docker-publish.yml in this same run.

  docker:
    needs: publish
    # Builds + pushes the multi-arch GHCR image in this same run. A
    # GITHUB_TOKEN-created release does not fire docker-publish.yml's `release`
    # trigger, so it is called directly instead of relying on the release event.
    # Runs when publish released the version, and also when the image for the
    # version is missing even though npm and the release are done (a cancelled
    # first run, or the duplicate-push case). `needs` still requires publish
    # to succeed. Tap and skills are continue-on-error, so only a tag, npm or
    # release failure blocks the image.
    if: needs.publish.outputs.changed == 'true' || needs.publish.outputs.docker_needed == 'true'
    # A duplicate run can see the image as missing while the first run's docker
    # job is still waiting on npm. Queue the builds rather than race two pushes
    # of the same tag. The second one only rebuilds the same version.
    concurrency:
      group: release-docker-main
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.publish.outputs.version }}
    secrets: inherit
