version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # Ignore major version updates for core packages
    # (Review and update these manually to avoid breaking changes)
    ignore:
      - dependency-name: "commander"
        update-types: ["version-update:semver-major"]
      - dependency-name: "execa"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      # Every @vitest/* package peer-depends on an exact vitest version, so a
      # major here can never install while vitest itself is pinned above.
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # @types/vscode must never exceed vscode/package.json `engines.vscode`:
      # `vsce package` refuses to build when it does, and every VS Code API
      # release is a *minor* on the 1.x line, so the minor group bump alone
      # broke packaging once (1.80 → 1.138). Move it together with engines,
      # deliberately. tools/check-workspace-deps.mjs enforces the pairing.
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
